<%@page contentType="text/html" pageEncoding="UTF-8"%>
<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Cartelera de Anime</title>
        <link rel="stylesheet" href="css/stylos.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="js/peliculas.js"></script>
    </head>
    <body>
        <div class="contenedor-principal">
            <h1>🎬 Cartelera de Anime & Películas</h1>
            <p class="subtitulo">Explora las mejores historias animadas del cine</p>
            
            <div class="panel-controles">
                <button id="btnCargar" class="btn-principal">Cargar Películas</button>
                
                <button id="btnVerFavoritos" class="btn-secundario">⭐ Ver Favoritos (<span id="contadorFavs">0</span>)</button>
                
                <select id="filtroGenero">
                    <option value="">Todos los géneros</option>
                    <option value="Romance">Romance</option>
                    <option value="Drama">Drama</option>
                    <option value="Fantasía">Fantasía</option>
                    <option value="Ciencia Ficción">Ciencia Ficción</option>
                </select>
            </div>

            <input type="text" id="buscar" placeholder="Buscar película por título...">
            
            <p id="contador"></p>
            
            <div class="tabla-contenedor">
                <table id="tablaPeliculas">
                    <thead>
                        <tr>
                            <th>Poster</th>
                            <th>Película</th>
                            <th>Género</th>
                            <th>Año</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="listaPeliculas">
                    </tbody>
                </table>
            </div>
        </div>
        
        <footer>
            <p> Hecho por D. Ancajima A. © 2026 
            <br> Si algo funciona, fue intencional. Si no funciona... también. </p> 
        </footer>
    </body>
</html>
